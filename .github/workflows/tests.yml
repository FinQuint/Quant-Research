name: Python tests

on:
  push:
    branches:
      - main
      - feature/fixed-income-analytics
      - feature/curve-portfolio-risk
      - feature/market-multi-curves
      - feature/short-rate-models
      - feature/historical-risk-stress-testing
      - feature/research-governance
      - feature/specialist-agent-execution
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run Phase 6 example
        run: python examples/portfolio_risk_pipeline.py

      - name: Run Phase 7 example
        run: python examples/multi_curve_pipeline.py

      - name: Run Phase 8 example
        run: python examples/short_rate_models.py

      - name: Run Phase 9 example
        run: python examples/historical_risk_pipeline.py

      - name: Run Phase 10A example
        run: python examples/governed_research_workflow.py

      - name: Run Phase 10B example
        run: python examples/specialist_agent_workflow.py
